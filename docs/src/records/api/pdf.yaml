format: 1
id: chromium.api.pdf
kind: topic
surface: null
lifecycle:
  status: current
  stability: experimental
  since: unversioned
  deprecated-since: null
  removed-in: null
  replacement: null
documentation:
  status: complete
  title: PDF API
  title-style: text
  summary: Discovery, borrowed HTML and options, PDF byte ownership, typed failures, and content-policy
    boundaries.
  tags:
  - chromium
  - pdf
  blocks:
  - type: markdown
    markdown: |-
      `render-pdf` is a one-shot convenience operation; it does not replace the
      managed page API. Its HTML/browser/printing argument shape remains stable
      for consumers such as docs-converter. The page reference documents reusable
      navigation, evaluation, screenshot, printing, and diagnostics operations.
  sections:
  - id: browser-discovery
    title: Browser discovery and selection
    blocks:
    - type: markdown
      markdown: |-
        `find-executable;` returns `string|none`: an installed executable filename,
        or `none` if discovery fails. It honors `CHROME` and the native backend's
        platform search locations. Discovery does not launch, download, or prove
        that a browser can start successfully.

        `browser-options.executable string|none = none` selects the browser.
        Supply a path to bypass discovery; `none` selects automatic discovery at
        render time. An invalid explicit executable raises `chromium-error` rather
        than falling back to a different browser. Set `CHROME` in the process
        environment before launching the consumer when using environment-based
        selection.
        `timeout-ms` defaults to 30000 and `diagnostic-capacity` to 1000; see
        [[chromium.api.page#configuration]] for all browser and page options.
  - id: render-pdf
    title: Render supplied HTML
    blocks:
    - type: example
      id: render-signature
      title: Public rendering signature
      language: terrane
      mode: illustrative
      target: null
      timeout-ms: null
      source: public function render-pdf bytes throws chromium-error; html ref string, browser
        ref browser-options, printing ref pdf-options
      response: null
      diagnostic: null
      markdown: null
    - type: markdown
      markdown: |-
        Pass named HTML and option values as shown in
        [[chromium.tutorial.render-pdf#complete-application]]. The function borrows
        all three arguments and does not mutate caller options or HTML. It returns
        owned PDF `bytes`, which callers may save, upload, or otherwise consume.

        The backend installs the supplied HTML DOM directly, optionally opens
        `details` elements, waits for document images to decode and document fonts
        to become ready, then invokes Chromium's print engine. There is no
        whole-document Markdown intermediary. The browser/tab lifetime remains
        inside the call; native handles are not returned.

        Paper sizes, dimensions, margins, orientation, scale, and page ranges are
        configured through `pdf-options`; see [[chromium.api.page#configuration]].
        Custom header/footer templates and browser launch flags are not exposed.
        A caller-selected HTML base URL is available through the managed page API.
  - id: print-options
    title: PDF options
    blocks:
    - type: markdown
      markdown: |-
        Construct `pdf-options` with no arguments and assign fields as needed.
        `display-header-footer`, `print-background`, `prefer-css-page-size`, and
        `expand-disclosures` default to `false`. Other fields describe optional
        paper dimensions, margins, scale, and page ranges; `landscape` defaults
        to `false`. The package does not apply docs-converter-specific policy.
    - type: table
      id: option-fields
      title: pdf-options fields
      show-header: true
      columns:
      - id: field
        title: Field
        cell: code
      - id: default
        title: Default
        cell: code
      - id: meaning
        title: Behavior
        cell: text
      rows:
      - field: display-header-footer
        default: 'false'
        meaning: Include Chromium's default print headers and footers.
      - field: print-background
        default: 'false'
        meaning: Print background graphics.
      - field: prefer-css-page-size
        default: 'false'
        meaning: Give the CSS @page size preference over the browser's default paper size.
      - field: expand-disclosures
        default: 'false'
        meaning: Open all HTML details elements in the installed DOM before printing; otherwise
          preserve their supplied state.
  - id: errors
    title: Failure handling
    blocks:
    - type: markdown
      markdown: |-
        `chromium-error` implements `/core/errors::throwable`. Its `message string`
        contains the backend failure text; its constructor takes that message and
        `render;` returns it. Discovery or launch failure during rendering, DOM
        installation failure, image/font readiness failure, and printing failure
        are translated to this type. No partial PDF bytes are returned on failure.

        Catch `chromium-error` or let the enclosing function's error contract admit
        it. Native diagnostic wording is not a stable machine-readable error code.
        The following diagnostic example deliberately chooses a missing executable
        and does not require a browser installation. Output persistence is a
        separate caller operation, so filesystem write failures are not
        `chromium-error`.
    - type: example
      id: catch-render-failure
      title: Catch a typed browser failure
      language: terrane
      mode: illustrative
      target: null
      timeout-ms: null
      source: |-
        namespace app

        from /streaky/chromium import browser-options, pdf-options, render-pdf, chromium-error

        function main;
            browser = instance browser-options;
            browser.executable = '/definitely-missing-chromium/browser'
            printing = instance pdf-options;
            html = '<!doctype html><p>Report</p>'
            try
                data = render-pdf; html, browser, printing
                print; 'Rendered PDF bytes: ', data.length
            catch chromium-error as failure
                print; failure.message
      response: null
      diagnostic: null
      markdown: null
  - id: content-policy
    title: HTML, assets, and security
    blocks:
    - type: markdown
      markdown: |-
        Supply trusted HTML or enforce your own content policy before rendering.
        The library does not sanitize HTML, restrict network destinations, or act
        as a safe renderer for arbitrary untrusted documents. Browser sandboxing is
        not a network-access policy. Absolute URLs may cause browser network
        requests according to the supplied content and host environment.

        Relative asset URLs have no caller-selected base URL for this convenience
        function. Prefer self-contained HTML or embedded image data. Required fonts
        must be available to the browser. Asset readiness does not establish a
        general application-ready condition for arbitrary JavaScript. For
        caller-selected HTML base URLs, readiness selectors/expressions, and
        timeouts, use the managed page API in [[chromium.api.page]]. Use print CSS
        for pagination and code wrapping; those are document policy, not
        transformations performed by this library.
  see-also:
  - chromium.guide.introduction
  - chromium.tutorial.render-pdf
