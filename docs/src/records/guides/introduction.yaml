documentation:
  status: complete
  title: streaky/chromium
  title-style: text
  summary: Managed Chromium pages for URL and HTML loading, JavaScript, screenshots, diagnostics, and PDF rendering.
  tags:
  - chromium
  - pdf
  blocks:
  - type: markdown
    markdown: |-
      `streaky/chromium` exposes a managed Chromium page API and a one-shot
      HTML-to-PDF convenience function. Callers supply page content and own
      storage, uploads, and document-specific policy.

      Start with [[chromium.api.page]] for page operations, options, diagnostics,
      security, and lazy-loading limits. The PDF convenience API is documented in
      [[chromium.api.pdf]], with a complete application in
      [[chromium.tutorial.render-pdf]].
  - type: example
    id: package-manifest
    title: Consumer package.toml
    language: toml
    mode: illustrative
    target: null
    timeout-ms: null
    source: |-
      package = "chromium-report"
      rust-toolchain = "pinned"

      [namespaces]
      app = "src"

      [profile]
      capabilities = ["build", "filesystem", "process", "threads", "networking"]

      [terrane-dependencies.streaky.chromium]
      path = "../chromium"
    response: null
    diagnostic: null
    markdown: null
  - type: markdown
    markdown: |-
      Resolve the dependency path relative to the consumer's `package.toml`;
      replace `../chromium` with the location of this library. The example assumes
      a sibling checkout. There is no helper executable or manual bootstrap step.
      The declared capabilities admit the package's native browser dependency.
  sections:
  - id: runtime
    title: Runtime prerequisites
    blocks:
    - type: markdown
      markdown: |-
        Install Chromium or Chrome separately. The library does not download a
        browser. Set `CHROME` to its executable path when automatic discovery is
        insufficient, or supply `browser-options.executable` explicitly. See
        [[chromium.api.pdf#browser-discovery]] for selection behavior.

        The browser runs headless with its sandbox enabled and a temporary private
        profile. The host must permit sandboxed Chromium to launch. No
        sandbox-disable option is exposed. On Unix, keep `TMPDIR` short enough for
        Chromium's Unix-domain socket paths; the usual `/tmp` works.

        PDF rendering uses installed fonts and Chromium's CSS print support. Package
        checking and the missing-executable unit test do not require a working
        browser, but successful rendering does.
  - id: scope
    title: Current scope
    blocks:
    - type: markdown
      markdown: |-
        The public API contains Terrane-owned options and a source-owned shared
        page. Native browser and tab handles remain private. A page can navigate,
        install HTML, evaluate JavaScript, inspect diagnostics, capture screenshots,
        and print PDFs before explicit close or final-owner cleanup. See
        [[chromium.api.page]]. Browser downloads, sandbox disabling, click/type
        automation, and multi-page orchestration are not exposed.
  - id: native-boundary
    title: Current native-boundary accounting
    blocks:
    - type: markdown
      markdown: |-
        Public browser operations, launch configuration, retained tab ownership,
        event normalization, bounded diagnostics and cleanup policy live in Terrane.
        The package has no maintained Rust module and opens no extra observer socket.
        Its retained native listener preserves the exact weak registration token for
        removal before releasing page owners.

        Small inline crossings remain for source executable text to native `PathBuf`,
        native path display, host clocks/sleep, borrowed event-payload serialization,
        native JSON adaptation, dynamic-list joining and weak-token liveness. Each is
        documented beside its implementation with the capability that removes it.
        These are projection/representation gaps, not reasons to relocate browser
        policy or avoid small, short-lived clones.

        Exact document numbers no longer enable Serde JSON's private-number feature,
        so upstream typed events can decode fractional timestamps. There is no
        replacement parser fork. The listener callback only normalizes and enqueues:
        upstream invokes it under the registration mutex, so native add/remove and
        blocking browser operations must not be called reentrantly.
  see-also:
  - chromium.tutorial.render-pdf
  - chromium.api.pdf
