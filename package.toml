package = "streaky/chromium"
artifact = "library"
rust-toolchain = "pinned"

[namespaces]
"streaky/chromium" = "src"

# Supplies the projected standard Duration constructor used by browser timeouts.
[rust-dependencies.crossbeam-channel]
version = "=0.5.17"
effects = ["threads"]

[rust-dependencies.headless-chrome]
package = "headless_chrome"
version = "=1.0.22"
effects = ["filesystem", "process", "threads", "networking", "build"]

[rust-dependencies.serde-json]
package = "serde_json"
version = "=1.0.154"
effects = ["build"]

[profile]
capabilities = ["filesystem", "process", "threads", "networking", "build"]

[testing]
unit = "tests/unit"
integration = "tests/integration"

[testing.profile]
name = "chromium-tests"
capabilities = ["filesystem", "process", "threads", "networking", "build", "clocks"]

[rust-dependencies.tempfile]
version = "=3.27.0"
effects = ["filesystem"]

